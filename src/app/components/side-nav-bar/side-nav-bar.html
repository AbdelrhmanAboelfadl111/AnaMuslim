<aside class="h-100" [ngClass]="{ 'hide': isHide }">
    <div class="container p-0 d-flex justify-content-between align-items-center flex-column">
        <div class="item w-100 d-flex justify-content-center align-items-center flex-row-reverse">
            <a class="navbar-brand m-0" routerLink="/home">
                <img src="assets/imgs/logo.png" alt="anaMuslim">
            </a>
        </div>
    
        <div class="main w-100 h-100 d-flex justify-content-between align-items-center flex-column">
            <div class="item w-100 h-100 d-flex justify-content-center align-items-center">
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav m-auto  mb-2 mb-lg-0">
                        <li class="nav-item" routerLink="/quran" routerLinkActive="active">
                                <img src="/assets/imgs/quran.png" alt="">
                                <a class="nav-link mainFont itemHide">استماع القران الكريم</a>
                        </li>
                        <li class="nav-item" routerLink="/azkar"  [class.active]="isActive()">
                            <img src="/assets/imgs/azkar.png" alt="">
                            <a class="nav-link mainFont itemHide">أذكار</a>
                        </li>
                        <li class="nav-item">
                            <img src="/assets/imgs/live.png" alt="">
                            <a class="nav-link mainFont itemHide">البث المباشر</a>
                        </li>
                        <li class="nav-item">
                            <img src="/assets/imgs/salat.png" alt="">
                            <a class="nav-link mainFont itemHide">اوقات الصلاه</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="footer w-100">
                <div class="item" (click)="hideSideNav()">
                    
                    <h6 class="mainFont m-0">أظهار اقل</h6>
                    <img src="/assets/imgs/arrow.svg" alt="">
                </div>
            </div>
        </div>

    </div>
</aside>
